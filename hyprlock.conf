# Silver Phantom Lockscreen Configuration
# Pure Silver & Pitch Obsidian Dual-Tone

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(216, 219, 230, 0.8)
    inner_color = rgba(9, 10, 15, 0.9)
    font_color = rgb(230, 232, 242)
    fade_on_empty = false
    placeholder_text = <span foreground="##5d6274">Silver Phantom</span>
    hide_input = false
    check_color = rgb(216, 219, 230)
    fail_color = rgb(176, 180, 195)
    fail_text = <i>Access Denied ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(230, 232, 242)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgb(162, 168, 184)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 10
    halign = center
    valign = center
}
